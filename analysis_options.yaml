include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/app_localizations*.dart
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # App code, not a published package: doc comments on every public member
    # would be noise. Keep docs on domain logic where they matter.
    public_member_api_docs: false
