<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FabriSCAN+ Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<style>
/* Layout: review console (screen index + controls) beside a phone frame on desktop; the phone fills the screen on a real phone.
   Tokens = Hibla design system (docs/design/tokens.json), M3 role names. */
:root{
  --primary:#2E3F8F;--onPrimary:#FFFFFF;--primaryContainer:#DDE1F7;--onPrimaryContainer:#17225A;
  --secondary:#6B4E35;--onSecondary:#FFFFFF;--secondaryContainer:#F2DEC8;--onSecondaryContainer:#2A1A0B;
  --tertiary:#3D6B37;--onTertiary:#FFFFFF;--tertiaryContainer:#D3EBC8;--onTertiaryContainer:#10290D;
  --error:#B3261E;--onError:#FFFFFF;--errorContainer:#F9DEDC;--onErrorContainer:#410E0B;
  --surface:#FAF6EE;--onSurface:#3B2A1E;--onSurfaceVariant:#6B5644;
  --scLowest:#FFFFFF;--scLow:#F6F0E4;--sc:#F1EADC;--scHigh:#EBE3D3;--scHighest:#E5DCCA;
  --outline:#8C7A68;--outlineVariant:#D8CCB9;--inverseSurface:#3B2A1E;--onInverseSurface:#FAF6EE;
  --confHigh:#2F6B3A;--confHighC:#D5EDD3;--onConfHighC:#0F2E14;
  --confPos:#8A5A00;--confPosC:#FBE7C2;--onConfPosC:#2E1D00;
  --confNo:#A23A2A;--confNoC:#F9DCD5;--onConfNoC:#3D0A03;
  --glass:rgba(255,252,245,.78);--glassLine:rgba(59,42,30,.10);
  --stage:#E9E3D7;--frame:#141210;
  --f-disp:"Fraunces",Georgia,serif;--f-ui:"Plus Jakarta Sans",Roboto,system-ui,sans-serif;
  --ts:1;--gut:16px;
  --e-std:cubic-bezier(.2,0,0,1);--e-dec:cubic-bezier(.05,.7,.1,1);--e-acc:cubic-bezier(.3,0,.8,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#B7C2FF;--onPrimary:#15205A;--primaryContainer:#34418A;--onPrimaryContainer:#DDE1FF;
  --secondary:#DCC1A6;--onSecondary:#3D2914;--secondaryContainer:#55402B;--onSecondaryContainer:#F2DEC8;
  --tertiary:#9FD39A;--onTertiary:#0E3A10;--tertiaryContainer:#255322;--onTertiaryContainer:#D3EBC8;
  --error:#FFB4AB;--onError:#690005;--errorContainer:#93000A;--onErrorContainer:#FFDAD6;
  --surface:#17130F;--onSurface:#F1E8DA;--onSurfaceVariant:#CDBFAE;
  --scLowest:#120E0B;--scLow:#1F1A15;--sc:#2A241E;--scHigh:#342D26;--scHighest:#3F3730;
  --outline:#9A8B7A;--outlineVariant:#4E4337;--inverseSurface:#F1E8DA;--onInverseSurface:#3B2A1E;
  --confHigh:#8FD49A;--confHighC:#1E4A26;--onConfHighC:#D5EDD3;
  --confPos:#F2C46B;--confPosC:#5A3D00;--onConfPosC:#FBE7C2;
  --confNo:#FFB4A6;--confNoC:#7A2618;--onConfNoC:#F9DCD5;
  --glass:rgba(31,26,21,.78);--glassLine:rgba(241,232,218,.10);
  --stage:#0E0C0A;--frame:#000000;color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#B7C2FF;--onPrimary:#15205A;--primaryContainer:#34418A;--onPrimaryContainer:#DDE1FF;
  --secondary:#DCC1A6;--onSecondary:#3D2914;--secondaryContainer:#55402B;--onSecondaryContainer:#F2DEC8;
  --tertiary:#9FD39A;--onTertiary:#0E3A10;--tertiaryContainer:#255322;--onTertiaryContainer:#D3EBC8;
  --error:#FFB4AB;--onError:#690005;--errorContainer:#93000A;--onErrorContainer:#FFDAD6;
  --surface:#17130F;--onSurface:#F1E8DA;--onSurfaceVariant:#CDBFAE;
  --scLowest:#120E0B;--scLow:#1F1A15;--sc:#2A241E;--scHigh:#342D26;--scHighest:#3F3730;
  --outline:#9A8B7A;--outlineVariant:#4E4337;--inverseSurface:#F1E8DA;--onInverseSurface:#3B2A1E;
  --confHigh:#8FD49A;--confHighC:#1E4A26;--onConfHighC:#D5EDD3;
  --confPos:#F2C46B;--confPosC:#5A3D00;--onConfPosC:#FBE7C2;
  --confNo:#FFB4A6;--confNoC:#7A2618;--onConfNoC:#F9DCD5;
  --glass:rgba(31,26,21,.78);--glassLine:rgba(241,232,218,.10);
  --stage:#0E0C0A;--frame:#000000;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--onSurface);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:calc(24px*var(--ts));line-height:1;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";font-variation-settings:"FILL" 0;flex:none;user-select:none}
.fill{font-variation-settings:"FILL" 1}

/* ---------- console (desktop) ---------- */
.shell{display:grid;grid-template-columns:320px 1fr;height:100%}
.panel{background:var(--scLow);border-right:1px solid var(--outlineVariant);overflow:auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:18px}
.panel h1{font-family:var(--f-disp);font-size:22px;margin:0;font-weight:600}
.panel .sub{font-size:12.5px;color:var(--onSurfaceVariant);margin:2px 0 0;line-height:1.45}
.pgroup{display:grid;gap:8px}
.pgroup>b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--onSurfaceVariant)}
.seg{display:flex;border:1px solid var(--outline);border-radius:999px;overflow:hidden}
.seg button{flex:1;min-height:40px;font-size:13px;font-weight:600;border-right:1px solid var(--outline)}
.seg button:last-child{border-right:0}
.app .seg button{font:600 calc(14px*var(--ts))/1.2 var(--f-ui)}
.seg button[aria-pressed="true"]{background:var(--secondaryContainer);color:var(--onSecondaryContainer)}
.idx{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.idx button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;font-size:13.5px;min-height:34px}
.idx button:hover{background:var(--sc)}
.idx button[aria-current="true"]{background:var(--primaryContainer);color:var(--onPrimaryContainer);font-weight:700}
.idx code{font:600 11.5px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--onSurfaceVariant);min-width:62px}
.idx button[aria-current="true"] code{color:inherit}
.demo{display:grid;gap:6px}
.demo button{text-align:left;padding:10px 12px;border-radius:12px;background:var(--sc);font-size:13px;line-height:1.35;min-height:44px}
.demo button b{display:block;font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;min-height:40px}
.sw{width:44px;height:26px;border-radius:999px;background:var(--scHighest);border:2px solid var(--outline);position:relative;flex:none}
.sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--outline);top:3px;left:3px;transition:.15s var(--e-std)}
.sw[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"]::after{left:21px;background:var(--onPrimary)}
.stage{display:grid;place-items:center;overflow:hidden;position:relative;padding:20px}
.stagecap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--onSurfaceVariant)}
.devwrap{position:relative}
.device{position:absolute;top:0;left:0;transform-origin:top left;width:calc(var(--dw)*1px + 24px);height:calc(var(--dh)*1px + 24px);background:var(--frame);border-radius:52px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.25),inset 0 0 0 2px #2a2724}
.app{width:100%;height:100%;border-radius:40px;overflow:hidden;position:relative;background:var(--surface);color:var(--onSurface);isolation:isolate}
.menuBtn{display:none}

/* ---------- phone mode ---------- */
@media (max-width:760px){
  .shell{display:block}
  .panel{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:50;transform:translateX(-105%);transition:transform .3s var(--e-dec);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .panel.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .stage{padding:0;height:100%;display:block}
  .devwrap{width:100%!important;height:100%!important}
  .device{position:static;transform:none!important;width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .app{border-radius:0}
  .stagecap,.sbar{display:none!important}
  .menuBtn{display:grid;place-items:center;position:fixed;right:0;top:50%;z-index:40;width:22px;height:56px;border-radius:10px 0 0 10px;background:var(--inverseSurface);color:var(--onInverseSurface);opacity:.55}
  .scrim50{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
}

/* ---------- app type roles (scale with --ts) ---------- */
.dS{font:600 calc(36px*var(--ts))/1.2 var(--f-disp);letter-spacing:-.01em}
.hL{font:600 calc(32px*var(--ts))/1.22 var(--f-disp);letter-spacing:-.01em}
.hM{font:600 calc(28px*var(--ts))/1.25 var(--f-disp)}
.hS{font:600 calc(24px*var(--ts))/1.3 var(--f-disp)}
.tL{font:700 calc(20px*var(--ts))/1.4 var(--f-ui)}
.tM{font:700 calc(16px*var(--ts))/1.5 var(--f-ui)}
.tS{font:700 calc(14px*var(--ts))/1.45 var(--f-ui)}
.bL{font:400 calc(16px*var(--ts))/1.5 var(--f-ui)}
.bM{font:400 calc(14px*var(--ts))/1.45 var(--f-ui)}
.bS{font:500 calc(12px*var(--ts))/1.35 var(--f-ui)}
.lL{font:600 calc(14px*var(--ts))/1.4 var(--f-ui)}
.lM{font:600 calc(12px*var(--ts))/1.35 var(--f-ui);letter-spacing:.03em}
.lS{font:600 calc(11px*var(--ts))/1.4 var(--f-ui);letter-spacing:.04em}
.muted{color:var(--onSurfaceVariant)}
.app h1,.app h2,.app h3,.app h4,.app p{margin:0;text-wrap:balance}
.app p{text-wrap:pretty}

/* ---------- app structure ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);animation:enter .3s var(--e-dec)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sbar{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font:700 13px var(--f-ui);position:relative;z-index:5}
.sbar .ms{font-size:16px}
.sbar.onDark{color:#fff}
.body{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 var(--gut) 24px;display:flex;flex-direction:column;gap:16px}
.body>*{flex-shrink:0}
.body.navpad{padding-bottom:110px}
.body.flush{padding-left:0;padding-right:0}
.bar{display:flex;align-items:center;gap:4px;min-height:56px;padding:0 4px;flex:none}
.bar .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active{background:color-mix(in srgb,var(--onSurface) 10%,transparent)}
.row{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.btn{min-height:52px;border-radius:999px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 calc(15px*var(--ts))/1.2 var(--f-ui);transition:transform .15s var(--e-std),background .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.f{background:var(--primary);color:var(--onPrimary)}
.btn.t{background:var(--secondaryContainer);color:var(--onSecondaryContainer)}
.btn.o{border:1px solid var(--outline);color:var(--primary)}
.btn.x{color:var(--primary);padding:0 12px;min-height:48px}
.btn.d{color:var(--error)}
.btn.block{width:100%}
.btn .ms{font-size:calc(20px*var(--ts))}
.card{background:var(--sc);border-radius:22px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:999px;font:600 calc(12.5px*var(--ts))/1.3 var(--f-ui);background:var(--secondaryContainer);color:var(--onSecondaryContainer)}
.chip .ms{font-size:calc(16px*var(--ts))}
.chip.out{background:transparent;border:1px solid var(--outline);color:var(--onSurface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.eyebrow{font:700 calc(11.5px*var(--ts))/1.3 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--onSurfaceVariant)}
.sample{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;border:1px dashed var(--outline);font:600 calc(11.5px*var(--ts))/1.35 var(--f-ui);color:var(--onSurfaceVariant);align-self:flex-start}
.sample .ms{font-size:calc(15px*var(--ts))}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px}
.banner .ms{font-size:calc(22px*var(--ts));margin-top:1px}
.b-fiber{background:var(--secondaryContainer);color:var(--onSecondaryContainer)}
.b-info{background:var(--scHigh);color:var(--onSurface)}
.b-eco{background:var(--tertiaryContainer);color:var(--onTertiaryContainer)}
.b-err{background:var(--errorContainer);color:var(--onErrorContainer)}
.b-off{background:var(--confPosC);color:var(--onConfPosC)}
.divider{height:1px;background:var(--outlineVariant)}

/* fabric textures (stand-ins for macro photos) */
.tx{background-color:#efe6d0}
.tx-pina{background-color:#efe7d2;background-image:repeating-linear-gradient(0deg,rgba(140,118,80,.28) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(140,118,80,.22) 0 1px,transparent 1px 4px),radial-gradient(circle at 30% 30%,rgba(255,255,255,.6),transparent 60%)}
.tx-pinaseda{background-color:#f1e6cf;background-image:repeating-linear-gradient(0deg,rgba(150,120,70,.22) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(150,120,70,.16) 0 1px,transparent 1px 3px),linear-gradient(120deg,transparent 30%,rgba(255,250,235,.85) 50%,transparent 70%)}
.tx-jusi{background-color:#f3ecdc;background-image:repeating-linear-gradient(90deg,rgba(120,100,70,.18) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,transparent 0 22px,rgba(210,190,150,.6) 22px 26px),linear-gradient(160deg,#f7f1e3,#e6d9bc)}
.tx-organza{background-color:#e9ecf2;background-image:repeating-linear-gradient(0deg,rgba(90,100,130,.16) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(90,100,130,.16) 0 1px,transparent 1px 2px),linear-gradient(135deg,rgba(255,255,255,.7),transparent 45%,rgba(255,255,255,.55) 70%,transparent)}
.tx-cocoon{background-color:#ece3cf;background-image:repeating-linear-gradient(72deg,rgba(120,95,60,.18) 0 2px,transparent 2px 9px),repeating-linear-gradient(-58deg,rgba(255,255,255,.55) 0 1px,transparent 1px 11px),repeating-linear-gradient(15deg,rgba(120,95,60,.12) 0 1px,transparent 1px 7px)}
.tx-wool{background-color:#3b3d42;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.18) 0 1px,transparent 1px 6px)}
.tx-polyvis{background-color:#1f2a44;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(120deg,transparent 40%,rgba(255,255,255,.08) 55%,transparent 70%)}
.tx-cotton{background-color:#f4f5f2;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 2px)}
.tx-linen{background-color:#d9ccb2;background-image:repeating-linear-gradient(0deg,rgba(90,70,40,.2) 0 1px,transparent 1px 3px,rgba(90,70,40,.12) 3px 5px,transparent 5px 7px),repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 2px,transparent 2px 5px,rgba(90,70,40,.15) 5px 6px,transparent 6px 9px)}
.tx-crepe{background-color:#26222a;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px),radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.5px);background-size:4px 4px,5px 5px;background-position:0 0,2px 3px}
.tx-satin{background:linear-gradient(115deg,#5b1a2e 0%,#a3445f 34%,#efb6c4 47%,#8d2f4a 60%,#4a1424 100%)}
.tx-chiffon{background-color:#f1c9cf;background-image:repeating-radial-gradient(ellipse at 20% 120%,rgba(255,255,255,.35) 0 6px,transparent 6px 16px),linear-gradient(160deg,#f6d8dc,#e7aab4)}
.tx-tulle{background-color:#f3eef1;background-image:radial-gradient(circle,transparent 2.2px,rgba(140,110,130,.45) 2.6px,transparent 3.2px);background-size:7px 6px}
.tx-lace{background-color:#fbf8f2;background-image:radial-gradient(circle,transparent 5px,rgba(120,100,90,.35) 5.5px,transparent 7px),radial-gradient(circle,rgba(120,100,90,.25) 1.5px,transparent 2px);background-size:22px 22px,11px 11px;background-position:0 0,5px 5px}
.tx-taffeta{background-color:#2c5f6b;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),linear-gradient(110deg,#1e4650,#5e8f7d 45%,#a46f8a 55%,#1e4650)}
.tx-sinamay{background-color:#d8bf8a;background-image:repeating-linear-gradient(0deg,rgba(110,80,30,.55) 0 2px,transparent 2px 7px),repeating-linear-gradient(90deg,rgba(110,80,30,.5) 0 2px,transparent 2px 8px)}
.tx-inabel{background:repeating-linear-gradient(45deg,#1f2d6b 0 7px,#f3ecdc 7px 10px,#b2332c 10px 12px,#f3ecdc 12px 15px),repeating-linear-gradient(-45deg,#1f2d6b 0 7px,#f3ecdc 7px 10px);background-blend-mode:multiply}
.tx-tnalak{background-color:#3a1f17;background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(231,214,180,.85) 10px 13px,transparent 13px 22px),repeating-linear-gradient(0deg,#3a1f17 0 8px,#8f2a1d 8px 12px,#3a1f17 12px 20px,#e7d6b4 20px 22px)}
.tx-nonfabric{background:radial-gradient(circle at 60% 40%,#c9b38f 0 22%,#8a7356 40%,#4c3d2c 80%),#4c3d2c;filter:blur(1.5px)}
.scrimtxt{position:relative;overflow:hidden}
.scrimtxt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(23,19,15,.82) 100%)}
.scrimtxt>*{position:relative;z-index:1}
.scrimtxt.strong::after{background:linear-gradient(180deg,rgba(23,19,15,.38) 0%,rgba(23,19,15,.86) 100%)}

/* bento home */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sc);border-radius:22px;padding:14px;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;transition:transform .15s var(--e-std)}
.tile:active{transform:scale(.98)}
.tile.span{grid-column:1/-1}
.scanTile{background:var(--primary);color:var(--onPrimary);min-height:150px;position:relative;overflow:hidden;padding:18px}
.scanTile .weave{position:absolute;inset:0;opacity:.13;background-image:repeating-linear-gradient(0deg,currentColor 0 2px,transparent 2px 10px),repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 10px);mask-image:linear-gradient(90deg,transparent 30%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000)}
.scanTile>*{position:relative}
.fabBig{position:absolute;right:16px;bottom:16px;width:68px;height:68px;border-radius:20px;background:var(--primaryContainer);color:var(--onPrimaryContainer);display:grid;place-items:center;transition:border-radius .3s var(--e-dec),transform .3s var(--e-dec);animation:breathe 3.2s ease-in-out infinite}
.scanTile:active .fabBig{border-radius:34px;transform:scale(.94)}
@keyframes breathe{0%,100%{border-radius:20px}50%{border-radius:28px}}
.catTile{min-height:96px;color:#fff;padding:12px}
.catTile .lab{display:flex;flex-direction:column}
.recent{display:flex;gap:10px;overflow-x:auto;margin:0 calc(var(--gut)*-1);padding:2px var(--gut) 4px;scrollbar-width:none}
.recent button{flex:none;width:112px;text-align:left;display:flex;flex-direction:column;gap:6px}
.thumb{border-radius:16px;aspect-ratio:1;width:100%}

/* floating nav */
.nav{position:absolute;left:12px;right:12px;bottom:14px;z-index:20;height:72px;border-radius:999px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--glassLine);box-shadow:0 6px 24px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;font:600 calc(11px*var(--ts))/1.2 var(--f-ui);color:var(--onSurfaceVariant)}
.nav .pill{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.nav button[aria-current="page"]{color:var(--onSurface)}
.nav button[aria-current="page"] .pill{background:var(--primaryContainer);color:var(--onPrimaryContainer)}

.catCard{border-radius:24px;min-height:120px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;text-align:left}

.field .help{font:500 calc(12px*var(--ts))/1.35 var(--f-ui);color:var(--onSurfaceVariant);display:flex;gap:4px;align-items:center}

.ovl.center{align-items:center;justify-content:center;padding:24px}

.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}

.dotsnav{display:flex;gap:6px;justify-content:center}
.dotsnav i{width:8px;height:8px;border-radius:99px;background:var(--outlineVariant);transition:width .3s var(--e-dec)}
.dotsnav i.on{width:24px;background:var(--primary)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 8px}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:var(--sc);position:relative}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed var(--outline)}

function searchRes(){const q=st.q.trim().toLowerCase();
 if(q.length<2)return `<p class="bM muted">Type at least 2 letters. Try:</p><div class="chips">${['piña','satin','jusi','abacá','silk'].map(x=>`<button class="chip out" data-act="qset" data-q="${x}" style="min-height:48px">${x}</button>`).join('')}</div>`;
 const n=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();const qq=n(q);
 const r=F.filter(f=>n(f.name+' '+f.aka+' '+f.fibers.map(x=>x.f).join(' ')).includes(qq));
 return r.length?`<div class="list">${r.map(f=>`<button class="li" data-go="S18" data-fab="${f.id}"><span class="lt tx-${f.id}"></span><span class="grow stack" style="gap:2px"><span class="tS">${f.name}</span><span class="bS muted">${f.aka?esc(f.aka)+' · ':''}${f.cats.map(c=>CATS[c].name).join(', ')}</span></span>${ic('chevron_right')}</button>`).join('')}</div>`
 :`<div class="empty">${ic('search_off')}<p class="tM">No fabrics match "${esc(st.q)}"</p><p class="bM muted">Check the spelling, or browse by category.</p><button class="btn t" data-tab="S16">Browse fabrics</button></div>`}

/* =================== OVERLAYS =================== */
function overlay(html,{center=false,onClose}={}){closeOverlay();const o=document.createElement('div');o.className='ovl'+(center?' center':'');o.id='ovl';o.innerHTML=html;o.addEventListener('click',e=>{if(e.target===o){closeOverlay();onClose&&onClose()}});app.appendChild(o);const f=o.firstElementChild;if(f){f.setAttribute('tabindex','-1');f.style.outline='none';f.focus({preventScroll:true})}}
function closeOverlay(){const o=document.getElementById('ovl');o&&o.remove()}
const sheet=(title,inner)=>overlay(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><div class="sb"><div class="row"><h2 class="tL grow">${title}</h2><button class="ib" data-act="close" aria-label="Close">${ic('close')}</button></div>${inner}</div></div>`);
function dialog(title,body,acts){overlay(`<div class="dlg" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><h2 class="hS">${title}</h2><p class="bM muted">${body}</p><div class="acts">${acts}</div></div>`,{center:true})}
function toast(t,icon='check_circle'){const old=app.querySelector('.toast');old&&old.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=ic(icon)+`<span>${t}</span>`;app.appendChild(d);setTimeout(()=>d.remove(),2600)}
function otherSheet(){const f=FB[RESULT.A.top];sheet('Other possible matches',`<p class="bM muted">If ${f.name} doesn't look right, compare these. Tap one to see its care guide.</p>
 ${RESULT.A.others.map(([id,c])=>{const g=FB[id],k=c==='Possible match'?'pos':'no';return `<button class="optCard" data-act="pick" data-fab="${id}" data-conf="${k}" style="flex-direction:row;text-align:left"><span class="tx-${id}" style="width:96px;flex:none"></span><span class="in grow" style="gap:6px"><span class="tM" style="font-family:var(--f-disp);font-size:calc(19px*var(--ts))">${g.name}</span>${meter(k)}<span class="bS muted">${g.feats[0]} · ${g.feats[1]}</span></span></button>`}).join('')}
 <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn o grow" data-act="retake">${ic('replay')}Retake</button><button class="btn o grow" data-tab="S16">${ic('grid_view')}Browse all</button></div>`)}
function sourcesSheet(sec){sheet(sec?`Sources · ${sec}`:'Sources',`${sample('Sample citations: researchers to add APA 7 references')}
 ${(sec?[sec]:SECS.map(s=>s[1])).map(s=>`<div class="card stack" style="gap:6px;background:var(--sc)"><span class="lM muted">${s.toUpperCase()}</span><p class="bM">Author, A. A., &amp; Author, B. B. (Year). <i>Title of the book or article</i>. Publisher or Journal, volume(issue), pages. https://doi.org/…</p><span class="bS muted">Reviewed by: researcher name · date</span></div>`).join('')}
 <p class="bS muted">Every care section in the final app has at least one source, checked by a researcher.</p>`)}
function importSheet(){const n=st.hist.length;sheet(`Import your ${n} saved scans?`,`<p class="bL">You have ${n} scans saved on this phone as a guest. Add them to your account so they sync to any phone you log in to.</p>
 <div class="list">${st.hist.slice(0,3).map(x=>`<div class="li" style="min-height:52px;padding-block:6px"><span class="lt tx-${x.fab}" style="width:36px;height:36px;border-radius:10px"></span><span class="tS grow">${FB[x.fab].name}</span><span class="bS muted">${x.when.split(',')[0]}</span></div>`).join('')}</div>
 <p class="bS muted">Only small thumbnails are uploaded. Full photos stay on this phone. If you choose Not now, these scans stay on this phone only.</p>
 <div class="stack" style="gap:8px;position:sticky;bottom:-28px;background:var(--scLow);padding:8px 0 4px"><button class="btn f block" data-act="importYes">Yes, import ${n} scans</button><button class="btn x block" data-act="importNo">Not now</button></div>`)}
function delDialog(id){const x=st.hist.find(h=>h.id===id);if(!x)return;dialog('Delete this scan?',`${FB[x.fab].name} from ${x.when} will be removed from History${st.user?' on all your phones':''}. This can't be undone.`,`<button class="btn x" data-act="close">Cancel</button><button class="btn x d" data-act="delYes" data-hid="${id}">Delete</button>`)}
function picker(){sheet('Choose a photo',`<p class="bS muted">Your phone's photo picker. FabriSCAN+ only sees the photo you choose.</p><div class="picker">${['satin','pina','inabel','linen','chiffon','tnalak','nonfabric','lace'].map(x=>`<button class="tx-${x}" data-act="pickPhoto" data-tx="${x}" aria-label="Photo"></button>`).join('')}<button class="bad" data-act="badPhoto" aria-label="Damaged file">${ic('broken_image')}<span>file.heic</span></button></div>`)}
function photoTips(){sheet('Photo tips',`<div class="list">${TIPS.map(t=>`<div class="li" style="min-height:56px"><span class="le">${ic(t[0])}</span><span class="bM">${t[1]}</span></div>`).join('')}</div><button class="btn f block" data-act="close">Got it</button>`)}

/* =================== ROUTER =================== */
function parse(id){const [b,...r]=(id||'').split('-');return {base:b,v:r.join('-')||''}}
function render(id){clearT();closeOverlay();const {base,v}=parse(id);const fn=R[base]||R.S06;st.cur=R[base]?id:'S06';
 app.innerHTML=fn(v);try{history.replaceState(null,'','#'+st.cur)}catch(e){}
 if(v==='') {} if(base==='S19'&&v==='empty'){}
 if(base==='S26'){const q=document.getElementById('q');q&&q.focus({preventScroll:true});q&&q.addEventListener('input',e=>{st.q=e.target.value;document.getElementById('qres').innerHTML=searchRes()})}
 syncIndex();}
function go(id,{replace=false,reset=false}={}){if(reset)st.stack=[];else if(!replace&&st.cur&&st.cur!==id)st.stack.push(st.cur);render(id)}
function back(){const p=st.stack.pop();render(p||'S06')}
function startScan(){if(st.perm==='granted')go('S08');else if(st.perm==='denied')go('S07-denied');else go('S07')}
function save(fab,conf){const id='h'+Date.now();st.hist.unshift({id,fab,conf,when:'Today, just now',src:st.photo.src==='camera'?'Camera':'Gallery'});st.hid=id;return id}

/* =================== EVENTS (app) =================== */
app.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act],[data-tab]');if(!t||t.disabled)return;const d=t.dataset;
 if(d.cat)st.cat=d.cat;if(d.fab&&!d.act)st.fab=d.fab;if(d.care)st.care=d.care;if(d.hid&&!d.act)st.hid=d.hid;
 if(d.tab){go(d.tab,{reset:true});if(d.tab!=='S06')st.stack=['S06'];return}
 if(d.go){go(d.go,{replace:!!d.replace});if(d.jump)setTimeout(()=>jumpTo(d.jump),50);return}
 const a=d.act;
 const acts={
  back:()=>back(),close:()=>closeOverlay(),
  skip:()=>{st.onboarded=true;go('S05',{replace:true})},
  guest:()=>{st.onboarded=true;go('S06',{reset:true})},
  login:()=>go('S21'),signup:()=>go('S21-signup'),
  scan:()=>startScan(),
  upload:()=>{st.photo.src='gallery';picker()},
  allowCam:()=>overlay(`<div class="sysdlg" role="alertdialog" aria-label="System permission"><div style="text-align:center">${ic('photo_camera')}</div><p style="margin:0;text-align:center;font-size:16px">Allow <b>FabriSCAN+</b> to take pictures and record video?</p><button data-act="permYes">While using the app</button><button data-act="permOnce">Only this time</button><button data-act="permNo">Don't allow</button></div>`,{center:true}),
  permYes:()=>{st.perm='granted';syncPanel();go('S08',{replace:true})},permOnce:()=>{go('S08',{replace:true})},
  permNo:()=>{st.perm='denied';syncPanel();go('S07-denied',{replace:true})},
  openSettings:()=>{st.perm='granted';syncPanel();go('S08',{replace:true});toast('Camera allowed in Settings')},
  tips:()=>photoTips(),
  shoot:()=>{try{navigator.vibrate&&navigator.vibrate(18)}catch(_){}st.photo.src='camera';const fl=document.createElement('div');fl.className='flash';app.appendChild(fl);setTimeout(()=>go('S09'),260)},
  pickPhoto:()=>{st.photo={tx:d.tx,src:'gallery'};closeOverlay();go('S09')},
  badPhoto:()=>{closeOverlay();st.photo.src='gallery';go('S09-error')},
  retake:()=>{closeOverlay();if(st.photo.src==='gallery'){picker()}else{go(st.perm==='granted'?'S08':'S08',{replace:false})}},
  use:()=>{if(st.res==='A'){save(RESULT.A.top,'high')}st.stack=st.stack.filter(x=>!/^S0[789]/.test(x));go('S10',{replace:true})},
  other:()=>otherSheet(),
  pick:()=>{closeOverlay();const k=d.conf||'pos';if(st.cur.startsWith('S11')&&st.hist[0]&&st.hist[0].when==='Today, just now'){st.hist[0].fab=d.fab;st.hist[0].conf=k}else save(d.fab,k);st.care=d.fab;go('S15');toast(`Saved ${FB[d.fab].name} to History`,'bookmark_added')},
  stain:()=>{const f=FB[st.care];st.stainSel[f.id]=d.stain;t.parentElement.querySelectorAll('button').forEach(b=>{const on=b.dataset.stain===d.stain;b.setAttribute('aria-pressed',on);b.innerHTML=(on?ic('check'):ic(STAINS[b.dataset.stain].i))+STAINS[b.dataset.stain].n});document.getElementById('stainSteps').innerHTML=STAINS[d.stain].s.map(x=>`<li><span>${x}</span></li>`).join('')},
  toggleSec:()=>{const s=t.closest('.careSec');const o=s.dataset.open!=='false';s.dataset.open=!o;t.setAttribute('aria-expanded',!o)},
  jump:()=>jumpTo(d.sec),
  sources:()=>sourcesSheet(d.sec),
  delAsk:()=>delDialog(d.hid),
  delYes:()=>{st.hist=st.hist.filter(h=>h.id!==d.hid);closeOverlay();if(st.cur.startsWith('S20')){st.stack=['S06'];render('S19')}else render(st.cur);toast('Scan deleted','delete')},
  hidePrompt:()=>{st.histHidden=true;render(st.cur)},
  clearAsk:()=>dialog('Clear all history?',`All ${st.hist.length} scans will be removed${st.user?' from this phone and your account':' from this phone'}. This can't be undone.`,`<button class="btn x" data-act="close">Cancel</button><button class="btn x d" data-act="clearYes">Clear all</button>`),
  clearYes:()=>{st.hist=[];closeOverlay();render(st.cur);toast('History cleared','delete_sweep')},
  theme:()=>{setTheme(d.th);render(st.cur)},
  survey:()=>toast(st.offline?'You\'re offline. Connect to open the survey.':'Opens the survey form in your browser',st.offline?'wifi_off':'open_in_new'),
  pw:()=>{const i=document.getElementById('aPw');i.type=i.type==='password'?'text':'password';t.innerHTML=ic(i.type==='password'?'visibility':'visibility_off');t.setAttribute('aria-label',i.type==='password'?'Show password':'Hide password')},
  doLogin:()=>{const pw=document.getElementById('aPw').value;if(pw!=='hibla2026'){go('S21-error',{replace:true});return}st.user=document.getElementById('aEmail').value;st.onboarded=true;go('S06',{reset:true});toast('Logged in. History synced.','cloud_done')},
  doSignup:()=>{st.user=document.getElementById('aEmail').value;st.onboarded=true;go('S06',{reset:true});if(st.hist.length)setTimeout(importSheet,250);else toast('Account created','check_circle')},
  sendReset:()=>{back();toast('Reset link sent. Check your email.','mail')},
  importYes:()=>{closeOverlay();toast(`${st.hist.length} scans added to your account`,'cloud_done')},
  importNo:()=>{closeOverlay();toast('Your scans stay on this phone','smartphone')},
  logout:()=>{st.user=null;render('S23');toast('Logged out. You\'re now a guest.','logout')},
  delAcctAsk:()=>dialog('Delete your account?','Your login and synced history will be deleted from our servers. Scans on this phone stay unless you clear them. This can\'t be undone.',`<button class="btn x" data-act="close">Cancel</button><button class="btn x d" data-act="delAcct" ${st.offline?'disabled style="opacity:.45"':''}>Delete account</button>`),
  delAcct:()=>{st.user=null;closeOverlay();render('S23');toast('Account deleted','person_remove')},
  qset:()=>{st.q=d.q;const q=document.getElementById('q');q.value=d.q;document.getElementById('qres').innerHTML=searchRes()}
 };
 acts[a]&&acts[a]();
});
function jumpTo(k){const el=document.getElementById('sec-'+k);if(el){el.dataset.open='true';el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}}

/* =================== CONSOLE =================== */
const root=document.documentElement;
function setTheme(t){st.theme=t;if(t==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);try{localStorage.setItem('fs-theme',t)}catch(_){}syncPanel()}
function setDev(v){st.dev=v;const [w,h]=v.split('x').map(Number);const dv=$('#device');dv.style.setProperty('--dw',w);dv.style.setProperty('--dh',h);$('#cap').textContent=`${v==='390x844'?'iPhone · ':'Android · '}${w}×${h} dp${st.ts>1?' · text 1.3×':''}`;fit();syncPanel()}
function fit(){const dv=$('#device'),wrap=$('#devwrap');if(innerWidth<=760){dv.style.transform='';return}const [w,h]=st.dev.split('x').map(Number);const W=w+24,H=h+24;const s=Math.min(1,(innerHeight-56)/H,($('#stage').clientWidth-40)/W);dv.style.transform=`scale(${s})`;wrap.style.width=W*s+'px';wrap.style.height=H*s+'px'}
addEventListener('resize',fit);
function syncPanel(){
 document.querySelectorAll('#segRes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.res===st.res));
 document.querySelectorAll('#segTheme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===st.theme));
 document.querySelectorAll('#segDev button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev===st.dev));
 document.querySelectorAll('#segPerm button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.perm===st.perm));
 $('#swText').setAttribute('aria-checked',st.ts>1);$('#swOff').setAttribute('aria-checked',st.offline);}
function syncIndex(){document.querySelectorAll('#idx button').forEach(b=>b.setAttribute('aria-current',b.dataset.s===st.cur))}
$('#idx').innerHTML=SCREENS.map(([id,n])=>`<li><button data-s="${id}"><code>${id}</code><span>${n}</span></button></li>`).join('');
$('#idx').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.s;
 if(['S06','S16','S19','S23'].includes(id)||id.startsWith('S19'))st.onboarded=true;
 if(id==='S08'||id==='S08-gallery')st.perm='granted';
 if(id.startsWith('S20'))st.hid=(st.hist[0]||{}).id;
 if(id==='S14')st.res='A';
 if(id==='S22'&&!st.user){st.user='maria@example.com'}
 if(id==='S09')st.photo.src='camera';
 syncPanel();go(id,{reset:true});if(!['S06','S01'].includes(id))st.stack=['S06'];closePanel()});
$('#segRes').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.res=b.dataset.res;syncPanel()}});
$('#segTheme').addEventListener('click',e=>{const b=e.target.closest('button');if(b){setTheme(b.dataset.th);if(st.cur.startsWith('S23'))render(st.cur)}});
$('#segDev').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setDev(b.dataset.dev)});
$('#segPerm').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.perm=b.dataset.perm;syncPanel()}});
$('#swText').addEventListener('click',()=>{st.ts=st.ts>1?1:1.3;app.style.setProperty('--ts',st.ts);setDev(st.dev)});
$('#swOff').addEventListener('click',()=>{st.offline=!st.offline;syncPanel();render(st.cur)});
$('#reset').addEventListener('click',()=>{Object.assign(st,{res:'A',perm:'unknown',user:null,onboarded:false,hist:INIT_HIST(),histHidden:false,offline:false,stack:[],q:'',stainSel:{}});syncPanel();go('S01',{reset:true});closePanel()});
document.querySelector('.demo').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.demo;closePanel();
 const P={first:()=>{st.onboarded=false;go('S01',{reset:true})},
  scanA:()=>{st.res='A';st.onboarded=true;go('S06',{reset:true})},scanB:()=>{st.res='B';st.onboarded=true;go('S06',{reset:true})},scanC:()=>{st.res='C';st.onboarded=true;go('S06',{reset:true})},
  browse:()=>{st.onboarded=true;go('S16',{reset:true});st.stack=['S06']},history:()=>{st.onboarded=true;if(!st.hist.length)st.hist=INIT_HIST();go('S19',{reset:true});st.stack=['S06']},
  signup:()=>{st.onboarded=true;st.user=null;if(!st.hist.length)st.hist=INIT_HIST();go('S23',{reset:true});st.stack=['S06']}};
 P[k]();syncPanel()});
const panel=$('#panel');let scrimEl=null;
function closePanel(){panel.classList.remove('open');scrimEl&&scrimEl.remove();scrimEl=null}
$('#menuBtn').addEventListener('click',()=>{panel.classList.add('open');scrimEl=document.createElement('div');scrimEl.className='scrim50';scrimEl.onclick=closePanel;document.body.appendChild(scrimEl)});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==st.cur&&R[parse(h).base]){st.onboarded=true;go(h)}});
addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});

/* boot */
try{const t=localStorage.getItem('fs-theme');if(t)setTheme(t)}catch(_){}
setDev('360x800');syncPanel();
(function(){const h=location.hash.slice(1);if(h&&R[parse(h).base]&&h!=='S01'){st.onboarded=true;st.stack=['S06'];render(h)}else render('S01')})();
</script>
